# =============================================================================
# Hero Skills Plugin - Pre-commit Configuration
# =============================================================================
# Tech stack: Markdown (SKILL.md files), Shell scripts, JSON, YAML
# =============================================================================
# Note: HERO.md is no longer auto-updated by a pre-commit hook (too slow).
# Skills detect when HERO.md is stale and recommend running
# `wayfare:wayfare-init-repo recalibrate` to refresh it.
# =============================================================================

# Everything below runs on commit unless a hook overrides `stages` itself.
# Without this, a hook with no `stages` runs at EVERY installed stage — so the
# whole suite would also fire on push, doubling every commit's cost.
default_stages: [pre-commit]

default_install_hook_types:
  - pre-commit
  - commit-msg
  - pre-push

repos:
  # ===========================================================================
  # General safety checks
  # ===========================================================================
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: check-json
      - id: check-yaml
      - id: check-toml
      - id: detect-private-key
      # main is protected server-side too; this catches the mistake before the
      # push round-trip, and before a rejected push leaves a stranded commit.
      - id: no-commit-to-branch
        args: [--branch, main]
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending

  # ===========================================================================
  # Secret detection
  # ===========================================================================
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        # A committed baseline is what makes this hook actionable: without it
        # every pre-existing match re-reports on every run, and the noise
        # trains people to skip the hook. With it, only NEW findings surface.
        args: [--baseline, .secrets.baseline, --exclude-files, '.*\.lock$']

  # ===========================================================================
  # Markdown linting
  # ===========================================================================
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.48.0
    hooks:
      - id: markdownlint
        args: [--fix]

  # ===========================================================================
  # Markdown line wrapping
  # ===========================================================================
  # The formatter owns line breaks so no agent spends an edit re-wrapping a
  # paragraph by hand. --number keeps `1. 2. 3.` lists as written (mdformat
  # rewrites them all to `1.` otherwise); --compact-tables stops it padding
  # every table cell, which would make each one-cell edit a whole-table diff.
  # 0.7.22, not 1.0: mdformat-tables has no release that installs beside 1.0.
  - repo: https://github.com/hukkin/mdformat
    rev: 0.7.22
    hooks:
      - id: mdformat
        args: [--wrap, "80", --number, --compact-tables]
        additional_dependencies:
          - mdformat-gfm==1.0.0
          - mdformat-frontmatter==2.1.2
          - mdformat-tables==1.0.0
        exclude: ^(analysis|memory|docs/superpowers)/

  # ===========================================================================
  # Typo detection
  # ===========================================================================
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.2
    hooks:
      - id: codespell
        args: [--skip, '*.lock']
        exclude: ^analysis/
      - id: codespell
        name: codespell (analysis)
        args: [--skip, '*.lock', --ignore-words-list, "ans,ser,alls,fo,cler,secur,pres,froms,supersed,accreting"]
        files: ^analysis/

  # ===========================================================================
  # Shell script linting
  # ===========================================================================
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        args: [--severity=warning]
        files: \.sh$

  # ===========================================================================
  # Commit message convention (conventional commits)
  # ===========================================================================
  # ===========================================================================
  # Copyright headers
  # ===========================================================================
  # The header file is deliberately NOT the repo's LICENSE: insert-license's
  # own default (LICENSE.txt) would sit in the namespace GitHub scans to detect
  # the repo license. This repo ships shell and Markdown, so only the shell
  # scripts get stamped — Markdown carries no comment syntax the hook can use.
  #
  # --use-current-year: a frozen wrong year is worse than an annual diff. The
  # bump is one sweep each January:
  #   pre-commit run insert-license --all-files
  - repo: https://github.com/Lucas-C/pre-commit-hooks
    rev: v1.5.5
    hooks:
      - id: insert-license
        name: copyright header (shell)
        files: \.sh$
        args:
          - --license-filepath=.license-header.txt
          - --comment-style=#
          - --use-current-year

  # ===========================================================================
  # Pre-push: security scanning
  # ===========================================================================
  # Pre-push, not pre-commit: it is the slowest hook here, and a push is the
  # last point where catching a finding is still cheap.
  - repo: https://github.com/semgrep/semgrep
    rev: v1.156.0
    hooks:
      - id: semgrep
        stages: [pre-push]
        args:
          - --config=auto
          - --error
          - --skip-unknown-extensions

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]

  # ===========================================================================
  # Local hooks (wayfare specific)
  # ===========================================================================
  # GitHub scans an entire `run:` block for Actions expressions, shell
  # comments included, so an empty or malformed one rejects the WHOLE workflow
  # at startup — zero jobs, no verdict — and for auto-approve.yaml that is
  # every consumer calling it at @main. `check yaml` above parses such a file
  # happily, because it IS valid YAML; the break is a layer up and only an
  # Actions-aware linter sees it. Not the `actionlint-system` id: CI installs
  # pre-commit but not actionlint, so that one passes locally and fails there.
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
        args: [-shellcheck=, -pyflakes=]

  - repo: local
    hooks:
      - id: validate-plugin
        name: Validate wayfare plugin
        entry: ./scripts/validate.sh
        language: script
        pass_filenames: false
        always_run: true

      # Fires on the library, its tests, and the one doc a suite reads as its
      # spec — the suites are fast, but not free on every commit.
      # Glob, don't enumerate. Naming each suite meant a newly added
      # scripts/*.test.sh ran nowhere — it matched neither the entry nor the
      # trigger below — so the suite silently guaranteed nothing.
      # Unset what git exports to a hook first. From a linked worktree that
      # includes GIT_DIR, and a suite's fixture `git init` or `git config` then
      # lands in the real repo: it set core.bare=true here and wrote a `t`
      # identity into .git/config.
      - id: shell-unit-tests
        name: "Shell library unit tests"
        entry: bash -c 'unset $(git rev-parse --local-env-vars); for t in scripts/*.test.sh; do echo "-- $t"; bash "$t" || exit 1; done'
        language: system
        pass_filenames: false
        # docs/AGENTS-MD.md is the spec check-agents-md.test.sh reads its R5/R6
        # lists from, so an edit there must re-run the suite.
        files: ^(scripts/.*\.(sh|py)|assets/compliance/.*\.yaml|docs/AGENTS-MD\.md)$

      - id: agents-md
        name: "AGENTS.md meets docs/AGENTS-MD.md"
        entry: ./scripts/check-agents-md.sh
        language: script
        pass_filenames: false
        files: ^(AGENTS\.md|CLAUDE\.md|\.claude/rules/.*\.md|scripts/check-agents-md\.sh)$

      - id: agents-md-commit-msg
        name: "Commit message: no banned phrases"
        entry: ./scripts/check-agents-md.sh --commit-msg
        language: script
        stages: [commit-msg]

      # Deterministic, so it replaces the model call that used to review
      # every staged skill diff. What still needs judgment is
      # wayfare-audit-plugin's, run on demand, not on every commit.
      - id: check-docs
        name: "Docs: frontmatter, steps, prose, chains, counts, links"
        entry: scripts/check_docs.py
        language: python
        additional_dependencies: [pyyaml==6.0.3]
        pass_filenames: false
        always_run: true
