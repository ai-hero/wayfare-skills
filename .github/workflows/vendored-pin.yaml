name: Vendored pin

# Runs on every PR but compares only when the PR touches the tree, so the
# normal path stays offline. The skip is a step, not a `paths:` filter: a
# filtered workflow never reports, so a required check waits forever and CI-21
# fails.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: vendored-pin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Vendored tree matches its pinned commit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Depth 2 reaches the merge commit's first parent, which is the base, so
      # HEAD^1..HEAD is exactly what the PR changes.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: does the PR touch assets/security-audit/
        id: touched
        run: |
          set -euo pipefail
          if git diff --name-only HEAD^1 HEAD | grep -q '^assets/security-audit/'; then
            echo "yes=true" >> "$GITHUB_OUTPUT"
          else
            echo "no change under assets/security-audit/; nothing to compare"
          fi

      - if: steps.touched.outputs.yes == 'true'
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      # Offline, validate.sh cannot see a file and its manifest row edited
      # together. Exit 2 (upstream unreachable) fails here too: a pin nobody
      # could compare is not a pin that held.
      - name: compare with upstream
        if: steps.touched.outputs.yes == 'true'
        run: just verify-vendored-upstream
        env:
          GH_TOKEN: ${{ github.token }}
