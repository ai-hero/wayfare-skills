# The generic compliance CHECKS — the checklist items that test the controls
# in CONTROLS.yaml. The checker for each id lives in scripts/audit.py (or the
# fleet's own checkers.py) and is authoritative; `detect:` is a human
# description of it, never executed. The one `detect:` value the engine reads
# is `method: manual`, which declares that no checker exists on purpose — any
# other id without a checker fails to load, so a typo cannot report MANUAL
# forever.
#
# NO CHECK NAMES A REPO, here or in a fleet's overlay. `reference:` (the repo
# that was correct today) and `known_violations` (the repos excused when the
# check was written) are both retired: each stapled a snapshot of one fleet on
# one day to a rule meant to outlive it, and the snapshot is the half that
# rots — a named repo leaves the fleet and the rule goes on citing something
# the map no longer lists. Which repos pass is the AUDIT's output, derived per
# run from the repos FLEET.md lists; it is never input. A fleet's overlay still
# holds its incident `why:` history, checks of its own, and may narrow a check
# with `applies_to: [GROUP, ...]` naming its FLEET.md groups.
#
# `example:` carries what a reference repo used to demonstrate — the correct
# shape, inline. It is REQUIRED on a `method: manual` check: with no checker
# and no exemplar repo, prose alone leaves the reader to infer the shape, and
# two readers infer differently. Write the smallest snippet that would pass,
# and where the failure is subtle, the near-miss that does not.
#
# LAYERS are a taxonomy — the engine runs checks in control order:
#   structure — does the file exist? (no reading)
#   placement — is it in the right place, under the right name? (no reading)
#   content   — is what's inside it right?

version: 1

checks:

- id: CI-01
  control: C-SUPPLY
  scope: ci
  title: Third-party actions are pinned to a full commit SHA
  layer: content
  severity: high
  applies_to: all
  rule: >
    Every third-party action is pinned to a 40-character commit SHA with the
    version in a trailing comment. No mutable tags. ONE exception: a
    first-party reusable WORKFLOW under the fleet's own org may reference
    `main` — the callee's protected default branch — or a v-prefixed release
    tag. Any other branch is never acceptable, and a plain first-party action
    is not covered: the carve-out is for the fleet's distribution mechanism,
    not for the org.
  why: >
    A repointed tag silently changes what runs in a workflow that holds
    registry and deploy credentials. The carve-out is the price of a shared
    auto-approve workflow being shared at all — pinning its SHA turns every
    fix into one follow-up PR per consumer — and it is safe only because the
    callee gates its default branch on review.
  example: |
    # correct - third-party action pinned to a full SHA, version in a comment
    - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0

    # correct - the ONE carve-out: a first-party reusable WORKFLOW at @main
    uses: ai-hero/wayfare-skills/.github/workflows/auto-approve.yaml@main

    # WRONG - mutable tag on a third-party action
    - uses: actions/checkout@v5
    # WRONG - the carve-out is for a reusable workflow, not a plain
    # first-party action, and never for a branch other than the default
    - uses: ai-hero/some-action@some-branch
  detect:
    method: script
    description: every `uses:` in .github/workflows/ carries a 40-hex SHA, except a first-party reusable workflow under the plugin's org (`ai-hero/`, the owner of the shared auto-approve workflow) at `@main` or a v-tag

- id: CI-02
  control: C-SUPPLY
  scope: ci
  title: Dependabot covers every ecosystem the repo uses
  layer: structure
  severity: medium
  applies_to: all
  rule: >
    .github/dependabot.yml exists and covers github-actions plus every
    package ecosystem present (gomod, npm, docker).
  why: >
    SHA pinning without dependabot is how a repo silently stops receiving
    security updates.
  example: |
    # .github/dependabot.yml - one entry per ecosystem actually present
    version: 2
    updates:
      - package-ecosystem: github-actions   # required in every repo
        directory: /
        schedule: {interval: weekly}
      - package-ecosystem: gomod            # only if the repo has go.mod
        directory: /
        schedule: {interval: weekly}
      - package-ecosystem: npm              # only if the repo has package.json
        directory: /ui
        schedule: {interval: weekly}
    # WRONG - covering github-actions only while the repo also ships Go or npm
  detect:
    method: file_exists
    path: .github/dependabot.yml

- id: CI-04
  control: C-APPROVAL
  scope: ci
  title: The auto-approve workflow fails CLOSED
  layer: content
  severity: high
  applies_to: all
  rule: >
    The API response is checked for HTTP status before parsing; a missing,
    empty, or error response must NOT approve. The verdict is parsed from an
    anchored marker, not a bare grep for REQUEST_CHANGES anywhere in the text.
  why: >
    A fallback error string that does not match the verdict grep sends the
    else branch to APPROVE, so a missing API key, a 5xx, or a rate limit
    silently approves the PR. A thin caller into a shared workflow reports
    MANUAL here, not PASS: it holds no API call, so the property cannot be
    read from it.
  example: |
    # correct - status checked before parsing, verdict read from an anchor
    STATUS=$(curl -sS -o body.json -w '%{http_code}' "$API")
    [ "$STATUS" = 200 ] || { echo "api $STATUS"; exit 1; }   # no verdict, no approval
    VERDICT=$(grep -m1 '^VERDICT: ' body.json | cut -d' ' -f2)
    case "$VERDICT" in
      APPROVE) ;;                      # the ONLY path that approves
      *) exit 1 ;;
    esac

    # WRONG - fails OPEN. A 5xx, an empty body or a missing key leaves
    # VERDICT empty, the grep does not match, and the else branch approves.
    if curl -sS "$API" | grep -q REQUEST_CHANGES; then exit 1; else approve; fi
  detect:
    method: script
    description: the checker reads the workflow for the fail-open string; a thin caller returns MANUAL

- id: STRUCT-04
  control: C-SECRETS
  scope: repo
  title: detect-secrets has a baseline
  layer: structure
  severity: medium
  applies_to: all
  rule: >
    A repo running the detect-secrets hook has a committed .secrets.baseline.
  why: >
    Without a baseline every finding must be silenced with an exclude
    pattern, which is indistinguishable from never having looked.
  example: |
    # correct - the hook is wired AND a baseline is committed beside it
    # .pre-commit-config.yaml
    - repo: https://github.com/Yelp/detect-secrets
      hooks: [{id: detect-secrets, args: ['--baseline', '.secrets.baseline']}]
    # and `.secrets.baseline` exists in the repo root, committed.

    # WRONG - hook configured, no baseline. Every finding then has to be
    # silenced with an exclude pattern, which cannot be told apart from
    # never having looked.
  detect:
    method: file_exists
    path: .secrets.baseline
    only_if: .pre-commit-config.yaml references detect-secrets

- id: STRUCT-07
  control: C-AGENT
  scope: repo
  title: Hero skills are initialised and the wayfare-build-task flow works end to end
  layer: structure
  severity: medium
  applies_to: all
  rule: >
    Every repo has a HERO.md generated by wayfare:wayfare-init-repo, and the
    end-to-end wayfare-build-task flow runs against it.
  why: >
    HERO.md is consistent precisely because it is generated rather than
    hand-copied. The gap is that nothing verifies the flow it feeds still
    works end to end; a config that no longer drives its tool is a gate
    that reads as present and does nothing.
  example: |
    # correct - HERO.md is GENERATED and still drives the flow it feeds.
    # 1. the file exists and carries the generator's marker:
    #    <!-- Generated by wayfare:wayfare-init-repo. Re-run with
    #         wayfare:wayfare-init-repo recalibrate to refresh. -->
    # 2. and the flow it configures actually runs end to end:
    #    wayfare:wayfare-build-task on a throwaway task reaches a pushed PR.
    #
    # Checking 1 alone is what makes this check worth doing manually: a
    # HERO.md naming a deleted skill, a stale image or a branch pattern the
    # repo no longer uses reads as present and drives nothing. Config that
    # no longer reaches its tool is a gate that reports green and does not run.
  detect:
    method: manual

- id: SCAN-01
  control: C-EXCEPTION
  scope: ci
  title: Scanner exceptions pass the vendored expiry gate on every PR and every scan
  layer: content
  severity: high
  applies_to: all
  rule: >
    A repo that keeps scanner exceptions (any `.vex/*.json`, or a
    `.trivyignore.yaml`) carries `scripts/check-exception-expiry.sh`
    byte-identical to the plugin's `assets/exception-expiry/` copy. A workflow
    triggered by `pull_request` runs it, and so does every workflow that hands
    the exceptions to a scanner (`vex-location`, `trivyignores`). Where the
    repo keeps a `.trivyignore.yaml`, every invocation names it.
  why: >
    Docker Scout reads `expired_at` on an OpenVEX statement and ignores it: a
    statement dated in the past still suppresses its CVE, so the date is a
    note until something fails on it. Trivy does drop a lapsed
    `.trivyignore.yaml` entry, but silently, and the scan goes red with no
    word that an exception expired. The gate turns both into a named failure
    on the review date, and refuses an undated statement or one more than 90
    days out. It runs on PRs too, because a repo may have no scheduled scan,
    and a lapsed exception the repo dated itself is fixed by a one-file PR
    that passes the gate. Byte identity is the test because the script has no
    per-repo variation; the arguments carry what differs.
  example: |
    # correct - the PR workflow and the scan both run the vendored gate
    # (.github/workflows/build.yaml, on: pull_request)
    - name: Exception expiry
      run: ./scripts/check-exception-expiry.sh            # VEX only
    # (.github/workflows/image-scan.yaml, the job holding vex-location)
    - name: Exception expiry
      run: ./scripts/check-exception-expiry.sh .trivyignore.yaml   # both halves

    # WRONG - `expired_at` with nothing reading it. Scout still applies a
    # statement dated last year.
    - uses: docker/scout-action@...
      with: {vex-location: .vex}
  detect:
    method: script
    description: >
      NA without exceptions; the script equals the asset; every workflow with a
      `vex-location` or `trivyignores` input runs it; some pull_request
      workflow runs it; with a .trivyignore.yaml every run line names it
