name: PR Check

on:
  pull_request:
    branches: [main]

# Least-privilege floor. Without a top-level block, a job with no permissions:
# of its own inherits this repo's CONFIGURED default (Settings -> Actions ->
# Workflow permissions), not a platform constant, so a job added later gets
# more access than this file appears to grant.
permissions:
  contents: read

# Supersede in-flight runs: a PR that gets three pushes in a minute should
# validate the last one, not burn a runner on each. Safe to cancel because
# this workflow only validates. It publishes nothing.
concurrency:
  group: pr-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate plugin structure
    runs-on: ubuntu-latest
    # Cap the run. Structure validation and the shell suites finish in well
    # under this; the ceiling just stops a wedged step from pinning a runner
    # for the six-hour default.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      # Dependabot does not read `run:` lines, so these pins move only by hand.
      - name: Install tooling
        run: python3 -m pip install --quiet pyyaml==6.0.3 pre-commit==4.2.0

      # Each gate is one recipe, not a restatement of its commands (CI-09):
      # a gate defined both in the Justfile and here drifts, and the copy that
      # drifts is the one nobody runs locally. Separate steps rather than
      # `just check` so a red run names which gate failed without opening logs.
      - name: lint
        run: just lint

      - name: typecheck
        run: just typecheck

      - name: test
        run: just test

      - name: validate plugin structure
        run: just validate
