version: 2

updates:
  # github-actions is the one that matters most: it is the supply chain for the
  # workflow ~25 repos execute through auto-approve.yaml.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # Quarantine a release before adopting it. Security advisories are exempt
    # from `schedule` and `cooldown` alike — those PRs open as soon as the
    # advisory lands, which is the case this delay must not slow down.
    cooldown:
      default-days: 7
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  # The publishing venv renders manuscript HTML through WeasyPrint and parses
  # PDFs with PyMuPDF. Dependabot watches only the ecosystems listed here, so
  # without this entry no alert or PR ever reaches those pins.
  - package-ecosystem: pip
    directory: /publishing
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      publishing-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  # Hook revs are frozen to commit SHAs, so without this entry nothing ever
  # proposes a bump and the pins only age.
  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      pre-commit-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
