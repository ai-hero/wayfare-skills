name: Auto Approve

# Thin caller for the shared auto-approve workflow in ai-hero/wayfare-skills.
# All behavior lives there. An edit here reaches no other caller, and the
# installer will NOT overwrite it — it drops a .new beside it and exits 2,
# so a local edit sticks silently and this repo quietly stops tracking the
# shared logic.

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  auto-approve:
    # Deployment policy, deliberately here and not in the shared logic: the
    # shared workflow ships changed-file contents to a model, and a public
    # repo takes PRs from untrusted forks. On a public repo this produces a
    # SKIPPED run, which ship-pr reports as a workflow failure with no failing
    # step — if that is what you are staring at, check visibility first.
    #
    # The actor test is a different failure: a Dependabot-TRIGGERED event gets
    # no access to repository secrets, so ANTHROPIC_API_KEY below resolves to
    # empty, and passing an undefined secret to a reusable workflow kills the
    # run at startup — zero jobs, nothing to read. Measured on hero-template:
    # same caller, same callee, same day, the human-triggered run passed and
    # all three Dependabot-triggered ones failed. This skips only a comment
    # posted BY Dependabot; a human commenting @auto-approve on a Dependabot
    # PR is the normal deps flow and still runs.
    if: github.event.repository.private && github.actor != 'dependabot[bot]'
    # This block is the ceiling on the callee's token; the callee cannot
    # exceed it. A scope the shared workflow declares but this block lacks
    # is a startup validation error in this repo's run ("The workflow is
    # requesting 'checks: read', but is only allowed 'checks: none'") — no
    # step runs and no verdict is posted, so ship-pr sees a failed run with
    # no failing step. Keep this a superset of what the shared workflow
    # declares; `checks`/`statuses` feed its CI gate.
    permissions:
      pull-requests: write
      issues: write
      contents: read
      checks: read
      statuses: read
    # @main, deliberately: the fleet runs what is on the plugin repo's main and
    # nothing else. main there is PR-protected — approval required, stale
    # approvals dismissed on push, last-push approval required — so that
    # protection IS the gate, with no second ref anyone can aim elsewhere.
    # Roll back by reverting on main. Do not pin this to a tag or SHA without
    # reading CI-01: a pin means every fix to the shared workflow needs a PR
    # in every consuming repo before it is live anywhere.
    #
    # A pin would also never be bumped: ai-hero/wayfare-skills publishes no
    # tags and no releases (checked 2026-10-05: `gh api
    # repos/ai-hero/wayfare-skills/tags` and `/releases` both return an empty
    # list), and Dependabot bumps a SHA-pinned `uses:` by resolving the newest
    # release tag, so it would never open a PR for this line. Pin it, and add
    # it to .github/dependabot.yaml's github-actions entry, when
    # wayfare-skills cuts its first tag.
    #
    # The zizmor ignore below is for consumers that run zizmor, which flags
    # this line as unpinned-uses. CI-20 holds every consumer's caller to this
    # file byte for byte, so the ignore is here even though this repo does not
    # run zizmor; remove it from a consumer and CI-20 fails.
    uses: ai-hero/wayfare-skills/.github/workflows/auto-approve.yaml@main # zizmor: ignore[unpinned-uses] — see above: no upstream tags, so a pin would never be bumped
    # Never `secrets: inherit` — it hands the callee every secret this repo
    # holds. Name only what the callee declares.
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
